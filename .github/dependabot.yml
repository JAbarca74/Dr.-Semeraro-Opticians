version: 2
# cooldown: Dependabot espera a que una versión tenga cierta antigüedad antes de
# proponerla. La mayoría de los paquetes maliciosos se detectan y se retiran del
# registro en pocos días; esperar evita instalarlos. No afecta a las
# actualizaciones de seguridad, que siguen llegando en cuanto se publican.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Las versiones mayores de estos paquetes solo funcionan si suben juntas:
    # por separado, npm no resuelve las dependencias entre ellos (ERESOLVE) y el
    # PR nace roto. Cada grupo llega como un único PR, para migrarlo entero.
    groups:
      react-mayor:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
      vitest-mayor:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      eslint-mayor:
        patterns: ['eslint', 'eslint-*', '@typescript-eslint/*']
        update-types: [major]
      vite-mayor:
        patterns: ['vite', '@vitejs/*']
        update-types: [major]
      dependencias-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      dependencias-produccion:
        dependency-type: production
        update-types: [minor, patch]
    # ESLint 10 exige migrar `.eslintrc.cjs` a `eslint.config.js` (flat config) y
    # un eslint-plugin-react-hooks compatible: sin esa migración el PR siempre
    # falla. Se pausan sus versiones mayores hasta hacerla; las menores y los
    # parches siguen llegando. Ojo: ESLint 8 ya no recibe parches, así que si
    # aparece una alerta de seguridad de ESLint, la salida es hacer la migración
    # y quitar este bloque.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
      # Los tipos de Node siguen a la versión del runtime (engines.node >= 24),
      # no a la última de Node: los de una versión mayor posterior describen
      # funciones que el Node del proyecto no tiene. Se suben a mano junto con
      # `engines` y el `node-version` del CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
