<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Óptica Dr. Semeraro</title>
  <desc id="d">Banner animado: unos anteojos que se dibujan solos, un destello que cruza los lentes y una carta de agudeza visual.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2747"/>
      <stop offset="1" stop-color="#3c497d"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lentes">
      <circle cx="170" cy="180" r="64"/>
      <circle cx="335" cy="180" r="64"/>
    </clipPath>
    <style>
      .trazo { fill: none; stroke: #e8ecff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 420; stroke-dashoffset: 0; animation: dibujar 2.2s cubic-bezier(.6,0,.3,1) backwards; }
      .trazo.b { animation-delay: .35s; }
      .trazo.c { stroke-width: 6; animation-delay: .9s; }
      .vidrio { fill: #8ea2ff; opacity: .12; }
      .destello { animation: cruzar 5s ease-in-out 2.4s infinite; transform: translateX(-240px); }
      .titulo { font: 700 54px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #fff;
                animation: subir 1s ease-out 1s backwards; }
      .sub { font: 400 21px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #c9d1f5;
             animation: subir 1s ease-out 1.3s backwards; }
      .chips text { font: 600 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #e8ecff; text-anchor: middle; }
      .chips rect { fill: #fff; fill-opacity: .1; stroke: #fff; stroke-opacity: .25; }
      .chip { animation: subir .8s ease-out backwards; }
      .carta text { font: 700 26px 'Courier New', monospace; fill: #fff; opacity: .16; text-anchor: middle;
                    animation: enfocar 6s ease-in-out infinite; }
      .carta .f2 { animation-delay: 2s; } .carta .f3 { animation-delay: 4s; }
      @keyframes dibujar { from { stroke-dashoffset: 420; } }
      @keyframes cruzar { 0% { transform: translateX(-240px); } 45%, 100% { transform: translateX(480px); } }
      @keyframes subir { from { opacity: 0; transform: translateY(14px); } }
      @keyframes enfocar { 0%, 70%, 100% { opacity: .16; } 80% { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .destello { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#fondo)"/>
  <circle cx="1080" cy="40" r="180" fill="#fff" opacity=".04"/>
  <circle cx="60" cy="340" r="140" fill="#fff" opacity=".04"/>

  <!-- Anteojos -->
  <circle class="vidrio" cx="170" cy="180" r="64"/>
  <circle class="vidrio" cx="335" cy="180" r="64"/>
  <g clip-path="url(#lentes)">
    <rect class="destello" x="60" y="80" width="80" height="200" fill="url(#brillo)"/>
  </g>
  <circle class="trazo" cx="170" cy="180" r="64"/>
  <circle class="trazo b" cx="335" cy="180" r="64"/>
  <path class="trazo c" d="M234 170 Q252 152 271 170"/>
  <path class="trazo c" d="M106 172 L66 150 M399 172 L439 150"/>

  <!-- Texto -->
  <text class="titulo" x="500" y="150">Óptica Dr. Semeraro</text>
  <text class="sub" x="502" y="190">Gestión clínica para ópticas · React · NestJS · PostgreSQL</text>

  <g class="chips" transform="translate(502 222)">
    <g class="chip" style="animation-delay:1.6s"><rect width="118" height="34" rx="17"/><text x="59" y="22">Expedientes</text></g>
    <g class="chip" style="animation-delay:1.75s"><rect x="128" width="88" height="34" rx="17"/><text x="172" y="22">Agenda</text></g>
    <g class="chip" style="animation-delay:1.9s"><rect x="226" width="108" height="34" rx="17"/><text x="280" y="22">Inventario</text></g>
    <g class="chip" style="animation-delay:2.05s"><rect x="344" width="120" height="34" rx="17"/><text x="404" y="22">Laboratorio</text></g>
    <g class="chip" style="animation-delay:2.2s"><rect x="474" width="88" height="34" rx="17"/><text x="518" y="22">Portal</text></g>
  </g>

  <!-- Carta de agudeza visual -->
  <g class="carta" transform="translate(1135 0)">
    <text y="244" style="font-size:42px">E</text>
    <text class="f2" y="286">F P</text>
    <text class="f3" y="318" style="font-size:18px">T O Z</text>
  </g>
</svg>
