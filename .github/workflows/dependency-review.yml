name: Revisión de dependencias

# Bloquea un PR que añada o actualice una dependencia con vulnerabilidades
# conocidas, y avisa si el paquete tiene mala nota en OpenSSF Scorecard (señal
# de proyecto abandonado o de posible typosquatting).
on: pull_request

permissions:
  contents: read

jobs:
  revisar:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comentar el resumen en el PR cuando falla
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
          comment-summary-in-pr: on-failure
