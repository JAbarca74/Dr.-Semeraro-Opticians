name: CI

# `push` solo en master: en las ramas de un PR ya corre por `pull_request`. Con
# `push` en todas las ramas cada PR corría dos veces, y la corrida duplicada
# dejaba a veces un check «en curso» fantasma que bloqueaba la fusión.
on:
  push:
    branches: [master]
  pull_request:

# Mínimo privilegio: el token del workflow solo lee el código. Importa más
# ahora que el repositorio es público y recibe PR de forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las acciones van fijadas por SHA (OpenSSF Scorecard, Pinned-Dependencies): una
# etiqueta como `@v7` se puede mover a otro commit; un SHA no. El comentario
# dice la versión, y Dependabot actualiza ambos a la vez.
jobs:
  quality:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Sin scripts de instalación: es la vía habitual del malware en npm.
      # `.npmrc` ya lo impone; se repite aquí para que no dependa de ese archivo.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Verificar firmas del registro
        run: npm audit signatures

      - name: Validar lockfile
        run: npm run seguridad:lockfile

      - name: Escanear secretos
        run: npm run seguridad:secretos

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage
