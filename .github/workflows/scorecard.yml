name: Scorecard

# OpenSSF Scorecard: mide la postura de seguridad del repositorio (acciones
# fijadas, permisos de los tokens, protección de rama, SAST, dependencias…) y
# deja cada hallazgo en la pestaña Security → Code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [master]

permissions: read-all

jobs:
  analisis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # subir el SARIF a Code scanning
      id-token: write # firmar el resultado publicado (badge)
    # Ojo: para publicar el resultado, OpenSSF exige que este job no tenga más
    # pasos que estos y que el workflow no defina `env` ni `defaults` globales.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # La publicación (y el badge) solo existe para repos públicos.
          publish_results: ${{ !github.event.repository.private }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
